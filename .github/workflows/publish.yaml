name: Publish npm package

on:
  push:
    tags:
      - 'v*'
  # このジョブは PR の CI では一度も実行されないため、タグを打つ前に手動で経路を確認できるようにする。
  # workflow_dispatch では必ず dry-run になり、レジストリへの publish は行わない。
  workflow_dispatch:

# GITHUB_TOKEN は checkout の読み取りにしか使わない（npm publish の認証は NPM_TOKEN）。
# 未指定だとリポジトリ既定が適用され Contents を含む 18 スコープが write になるため、
# ビルド時に実行される依存が汚染された場合の書き戻しを防ぐ目的で明示的に絞る。
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read Node version from .node-version
        run: echo "node_version=$(cat .node-version)" >> $GITHUB_OUTPUT
        id: node-version

      # このジョブは共通の pnpm-install action を使わない（registry-url / scope の指定が要るため）。
      # corepack を有効化しないと pnpm が存在せず、PR の CI がすべて緑でもタグ発行時だけ失敗する。
      - name: Enable corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node-version.outputs.node_version }}
          registry-url: 'https://registry.npmjs.org'
          scope: '@zenkigen-inc'
          always-auth: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build npm package
        run: pnpm build-lib:all

      - name: Determine npm dist-tag
        if: github.event_name == 'push'
        id: dist-tag
        run: |
          # タグ名に '-'（プレリリース識別子）を含む場合は next、それ以外は latest。
          #   例: v2.0.0-rc.0 → next（@next でオプトイン） / v1.20.5 → latest
          # これにより安定版（latest）を壊さずにプレリリースを並行公開できる。
          # 安定版タグ（ハイフンなし）は常に latest になるため、v1 のリリース手順・結果は従来と同じ。
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "name=next" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish npm package
        if: github.event_name == 'push'
        # pnpm -r publish は「まだ公開されていないバージョンだけ」を publish するため、
        # 途中失敗後の再実行でも公開済み version が EPUBLISHCONFLICT を起こさない
        # （yarn の --tolerate-republish に相当する挙動が標準）。
        # タグからの checkout は detached HEAD になり publish ブランチ判定に掛かるため --no-git-checks が要る。
        run: pnpm publish:all --tag ${{ steps.dist-tag.outputs.name }} --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=8192

      # 手動実行時の検証。--force を付けないと「公開済みなので全スキップ」で何も検証せずに成功する。
      - name: Dry run publish (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm publish:all --dry-run --force --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_OPTIONS: --max_old_space_size=8192
